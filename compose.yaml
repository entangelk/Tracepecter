# Tracepecter 실행 환경 — Docker Compose (소유자 결정 2026-10-07, venv 대체).
#
# 사용:
#   docker compose run --rm dev python -m pytest
#   docker compose run --rm dev python -m src.train --config configs/baseline.yaml --smoke
#
# 데이터셋은 DATA_DIR 환경변수로 지정한 호스트 경로를 /data(읽기 전용)로 마운트한다.
# /mnt/f(Windows 드라이브)는 9p 로 느리므로 대량 읽기 작업은 서브셋을 ext4 로
# 복사해 진행한다(P00 venv 교훈과 동일).
# 생성은 gpu, 학습은 training profile로 필요 시점에만 기동한다.
# 소유자의 GPU 연산 작업이 있으면 학습·생성을 시작하지 않는다.
services:
  dev:
    build: .
    image: tracepecter/dev
    working_dir: /app
    volumes:
      - .:/app
      - ${DATA_DIR:-/mnt/f/data}:/data:ro
    command: ["python", "--version"]

  train:
    build:
      context: .
      dockerfile: Dockerfile.training
    image: tracepecter/train
    shm_size: 1gb
    profiles: ["training"]
    gpus: all
    working_dir: /app
    environment:
      HF_HOME: /app/checkpoints/hf_cache
      GIT_COMMIT: ${GIT_COMMIT:-}
    volumes:
      - .:/app
      - ${IMAGE_DIR:-${HOME}/data/tracepector/images}:/images:ro
    command: ["python", "-m", "src.train", "--config", "configs/baseline.yaml"]

  # ComfyUI GPU 서비스(P01-04 생성). GPU 점유 정책에 따라 profile 로 수동 기동:
  #   docker compose --profile gpu up -d comfyui
  # 모델은 소유자 Windows 설치(F:\AI\ComfyUI-models)를 읽기 전용 마운트해 재사용.
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile.comfyui
    image: tracepecter/comfyui
    profiles: ["gpu"]
    gpus: all
    ports:
      - "8188:8188"
    volumes:
      - /mnt/f/AI/ComfyUI-models:/ComfyUI/models:ro
      - ${HOME:-/root}/data/tracepector/comfy_output:/output
