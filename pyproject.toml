[project]
name = "tracepecter"
version = "0.1.0"
description = "Fashion Photo Realism Scorer — 패션 착용 이미지의 photographic realism을 0~100 점수로 평가하는 vision 모델 MVP"
requires-python = ">=3.10"

# 런타임 의존성의 canonical 목록은 requirements.txt (project.md §24).
# pyproject.toml 은 프로젝트 메타데이터와 도구 설정만 담는다.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
